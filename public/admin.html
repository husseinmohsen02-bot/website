<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>لوحة الطلبات — حَبّة بُن</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin-wrap { padding: 24px 0 64px; }
    .login { max-width: 380px; margin: 80px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    .login h2 { margin: 0; padding: 20px 20px 0; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .toolbar .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar select, .toolbar input { width: auto; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .stat b { display: block; font-size: 1.5rem; color: var(--brand); }
    .stat span { color: var(--muted); font-size: .9rem; }
    .orders { display: grid; gap: 12px; }
    .order { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
    .order-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
    .order-head h3 { margin: 0; font-size: 1.1rem; }
    .pill { padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; }
    .st-new { background: #fff4d6; color: #8a5a00; }
    .st-confirmed { background: #e3efff; color: #1d4f91; }
    .st-shipped { background: #efe6ff; color: #5b2ea6; }
    .st-delivered { background: #e7f6ec; color: #157a3c; }
    .st-cancelled { background: #fde8e8; color: #9b1c1c; }
    .order-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: .95rem; }
    .order-grid ul { margin: 0; padding-inline-start: 18px; }
    .order-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .order-actions select, .order-actions input { width: auto; padding: 6px 10px; }
    .btn-sm { padding: 6px 12px; font-size: .9rem; border-radius: 10px; }
    .wa-tag { font-size: .8rem; color: var(--muted); }
    @media (max-width: 700px) { .order-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="/" class="brand"><span class="brand-mark">☕</span> لوحة الطلبات</a>
      <button class="btn btn-ghost btn-sm" id="logout" hidden>خروج</button>
    </div>
  </header>

  <div class="container">
    <div class="login" id="loginBox">
      <h2>دخول الإدارة</h2>
      <form id="loginForm">
        <label>الباسورد <input type="password" name="password" required autocomplete="current-password"></label>
        <p class="form-error" id="loginError"></p>
        <button class="btn btn-dark btn-block">دخول</button>
      </form>
    </div>

    <div class="admin-wrap" id="panel" hidden>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <div class="filters">
          <select id="statusFilter">
            <option value="">كل الحالات</option>
            <option value="new">جديد</option>
            <option value="confirmed">مؤكَّد</option>
            <option value="shipped">اتشحن</option>
            <option value="delivered">اتسلّم</option>
            <option value="cancelled">ملغي</option>
          </select>
          <input type="search" id="search" placeholder="بحث بالاسم أو الموبايل أو رقم الطلب">
        </div>
        <div class="filters">
          <button class="btn btn-ghost btn-sm" id="refresh">تحديث</button>
          <button class="btn btn-primary btn-sm" id="exportCsv">تصدير Excel لشركة الشحن</button>
        </div>
      </div>
      <div class="orders" id="orders"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/admin.js"></script>
</body>
</html>
